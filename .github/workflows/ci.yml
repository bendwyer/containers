---
name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  ci:
    uses: bendwyer/github-workflows/.github/workflows/container-build-push.yml@main

  check:
    if: always()
    needs:
      - ci
    uses: bendwyer/github-workflows/.github/workflows/github-check.yml@main
    with:
      jobs: ${{ toJSON(needs) }}
