---
name: ci

on:
  pull_request:
    branches:
      - main
    paths:
      - "images/**/Dockerfile"
      - "images/**/get-version.sh"
      - "images/**/requirements.txt"
      - "images/**/*.py"
      - "images/**/*.patch"
      # Source-built images gate their tests in the Docker build, so a PR that
      # only touches their sources must still trigger CI.
      - "images/**/*.ts"
      - "images/**/*.js"
      - "images/**/*.json"
      - "images/**/*.sql"
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  ci:
    uses: bendwyer/github-workflows/.github/workflows/container-build-push.yml@main
